<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="120" fill="#2563EB"/>
  <!-- Elegant geometric monogram: Chevron > and Slash / forming E -->
  <g fill="none" stroke="#FFFFFF" stroke-width="48" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bracket / Chevron -->
    <path d="M 160 160 L 256 256 L 160 352" />
    <!-- Terminal Cursor / Bar -->
    <line x1="288" y1="352" x2="352" y2="352" stroke="#38BDF8" stroke-width="48" />
    <line x1="288" y1="160" x2="352" y2="160" stroke="#FFFFFF" stroke-width="48" />
  </g>
</svg>
