services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kodein_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-kodein_db}
      DB_USERNAME: ${DB_USERNAME:-kodein_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret123}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kodein_network

  web:
    image: nginx:alpine
    container_name: kodein_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - kodein_network

  db:
    image: mysql:8.0
    container_name: kodein_db
    restart: unless-stopped
    ports:
      - "${DB_FORWARD_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-kodein_db}
      MYSQL_USER: ${DB_USERNAME:-kodein_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - kodein_db_data:/var/lib/mysql
    networks:
      - kodein_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  kodein_network:
    driver: bridge

volumes:
  kodein_db_data:
    driver: local
