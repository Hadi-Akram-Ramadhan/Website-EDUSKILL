# Local development only. Dokploy: use Dockerfile directly with external PostgreSQL.
services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:?Generate an APP_KEY locally with php artisan key:generate --show}
      APP_URL: http://localhost:${APP_PORT:-8000}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-eduskill}
      DB_USERNAME: ${DB_USERNAME:-eduskill}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in local .env}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-eduskill}
      MYSQL_USER: ${DB_USERNAME:-eduskill}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in local .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in local .env}
    volumes:
      - eduskill_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  eduskill_db_data:
